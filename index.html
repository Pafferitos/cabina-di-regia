<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Cabina di Regia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Black with a blue gradient. One account: the FTMO 1-Step challenge simulated on Alpaca's paper account. */
:root {
  --bg: #04060b; --panel: rgba(14, 22, 40, .72); --panel-2: #0a1020; --line: rgba(80, 130, 255, .16);
  --fg: #eaf0ff; --muted: #8a97b5; --faint: #56607a;
  --blue: #3b82f6; --blue-2: #22d3ee; --blue-3: #1e3a8a;
  --grad: linear-gradient(135deg, #0b1d4d 0%, #1d4ed8 55%, #22d3ee 100%);
  --gain: #34d399; --loss: #fb7185; --warn: #fbbf24;
  --gain-bg: rgba(52, 211, 153, .12); --loss-bg: rgba(251, 113, 133, .12); --warn-bg: rgba(251, 191, 36, .12);
  --f: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 18px; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); -webkit-text-size-adjust: 100%; }
body { font: 15px/1.5 var(--f); min-height: 100vh;
  background: radial-gradient(1200px 600px at 80% -10%, rgba(37, 99, 235, .28), transparent 60%),
              radial-gradient(900px 500px at -10% 10%, rgba(34, 211, 238, .12), transparent 60%), var(--bg); background-attachment: fixed; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue-2); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.gain { color: var(--gain); } .loss { color: var(--loss); } .muted { color: var(--muted); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left)) 48px max(16px, env(safe-area-inset-right)); }

header.top { position: sticky; top: 0; z-index: 5; backdrop-filter: blur(14px); background: rgba(4, 6, 11, .72); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
.brand { font-weight: 800; letter-spacing: -.02em; font-size: 18px; margin-right: auto; display: flex; align-items: center; gap: 10px; }
.logo { width: 26px; height: 26px; border-radius: 8px; background: var(--grad); box-shadow: 0 0 24px rgba(59, 130, 246, .5); }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--panel-2); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.pill.on i { background: var(--gain); box-shadow: 0 0 10px var(--gain); }
.pill.off i { background: var(--warn); }
.pill.dead i { background: var(--loss); }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 9px 14px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--grad); border-color: transparent; color: #fff; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }

main { display: grid; gap: 16px; padding-top: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(10px); min-width: 0; }
.card > h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0; padding: 16px 18px 0; }
.card .body { padding: 14px 18px 18px; }

.hero { background: var(--grad); border: 0; position: relative; overflow: hidden; padding: 22px; display: grid; gap: 18px; }
.hero::after { content: ""; position: absolute; inset: auto -60px -120px auto; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(rgba(255,255,255,.18), transparent 70%); }
.hero .row { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: flex-end; position: relative; z-index: 1; }
.hero .label { font-size: 13px; color: rgba(255,255,255,.75); font-weight: 500; }
.hero .big { font-size: clamp(34px, 7vw, 52px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.hero .mid { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.hero .status { margin-left: auto; align-self: flex-start; background: rgba(4, 6, 11, .35); border: 1px solid rgba(255,255,255,.25); color: #fff; }
.hero .gain, .hero .loss { color: #fff; }
.hero .chip { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 6px; background: rgba(4, 6, 11, .3); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.goals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.goal { padding: 16px 18px; display: grid; gap: 8px; }
.goal .t { font-size: 13px; color: var(--muted); font-weight: 500; }
.goal .v { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.goal .s { font-size: 12.5px; color: var(--muted); }
.bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--grad); }
.bar i.warn { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.bar i.bad { background: linear-gradient(90deg, #e11d48, #fb7185); }

.list { display: grid; }
.item { padding: 12px 18px; border-top: 1px solid var(--line); display: grid; gap: 3px; }
.item:first-child { border-top: 0; }
.item .h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item .sym { font: 600 14px var(--mono); }
.item .r { margin-left: auto; font: 500 13px var(--mono); }
.item .t { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.tag { font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 2px 8px; }
.tag.ok { background: var(--gain-bg); color: var(--gain); }
.tag.no { background: var(--loss-bg); color: var(--loss); }
.tag.info { background: rgba(59,130,246,.15); color: #93c5fd; }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.empty { padding: 22px 18px; text-align: center; color: var(--muted); font-size: 14px; }
.scroll { max-height: 420px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.r { text-align: right; }
.tw { overflow-x: auto; }
.log { font: 12.5px/1.6 var(--mono); }
.log div { padding: 6px 18px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 64px 1fr; gap: 10px; }
.log time { color: var(--faint); }
.tabs { display: flex; gap: 4px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 9px 12px; color: var(--muted); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--blue-2); }
.seg { display: inline-flex; max-width: 100%; gap: 4px; padding: 4px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); margin-top: 14px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.rules-t td { white-space: normal; overflow-wrap: anywhere; }
.rules-t td.r { text-align: right; }
.seg button[aria-selected="true"] { background: var(--grad); color: #fff; }
.banner { font-size: 13px; color: var(--muted); padding: 8px 0 0; }
.setup { max-width: 520px; margin: 40px auto; padding: 24px; display: grid; gap: 14px; }
.setup h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
.setup p { margin: 0; color: var(--muted); }
.setup input { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font-family: var(--mono); }
.setup .row { display: flex; gap: 8px; flex-wrap: wrap; }
.err { color: var(--loss); font-size: 13px; }
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 16px; }
.sheet .card { width: min(420px, 100%); padding: 20px; display: grid; gap: 12px; }
.sheet h3 { margin: 0; }
@media (max-width: 900px) { .goals { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 480px) { .seg { display: flex; } .seg button { flex: 1; padding: 8px 6px; font-size: 13px; } .goal .v { font-size: 19px; } .hero { padding: 18px; } .goals { gap: 10px; } .goal { padding: 14px; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="logo"></span>Cabina di Regia</div>
  <span class="pill" id="runPill"><i></i><span id="runText">…</span></span>
  <button class="btn" id="toggleBtn" hidden></button>
</div></header>

<div class="wrap">
  <nav class="seg" role="tablist" id="views">
    <button role="tab" data-v="veloce" aria-selected="true">Veloce · 1-Step</button>
    <button role="tab" data-v="swing" aria-selected="false">Swing · 2-Step</button>
    <button role="tab" data-v="crypto" aria-selected="false">Crypto · 2-Step</button>
  </nav>
  <div class="banner" id="banner"></div>
  <section class="card setup" id="setup" hidden>
    <h1>Collega la pagina al bot</h1>
    <p>Incolla il token GitHub (inizia con <code>github_pat_</code>). Resta solo in questo browser.</p>
    <input id="tok" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
    <div class="row"><button class="btn primary" id="tokGo">Collega</button><button class="btn ghost" id="tokPreview">Guarda l'anteprima</button></div>
    <div class="err" id="tokErr" hidden></div>
  </section>

  <main id="app" hidden>
    <section class="card hero">
      <div class="row">
        <div><div class="label" id="heroLabel">Conto della prova FTMO</div><div class="big num" id="equity">–</div></div>
        <span class="pill status" id="challenge">–</span>
      </div>
      <div class="row">
        <div><div class="label">Oggi</div><div class="mid num" id="today">–</div></div>
        <div><div class="label">Dall'inizio</div><div class="mid num" id="total">–</div></div>
        <div><div class="label">Aggiornato</div><div class="mid" id="updated" style="font-size:16px;font-weight:600">–</div></div>
      </div>
    </section>

    <section class="goals" id="goals"></section>

    <div class="grid2">
      <section class="card"><h2>Posizione aperta</h2><div class="list" id="open"></div></section>
      <section class="card"><h2>Il Dubbio: ultime decisioni</h2><div class="list scroll" id="verdicts"></div></section>
    </div>

    <section class="card">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-t="trades" aria-selected="true">Operazioni</button>
        <button class="tab" role="tab" data-t="days" aria-selected="false">Giorni</button>
        <button class="tab" role="tab" data-t="log" aria-selected="false">Registro</button>
        <button class="tab" role="tab" data-t="news" aria-selected="false">Notizie</button>
        <button class="tab" role="tab" data-t="rules" aria-selected="false">Regole</button>
      </div>
      <div id="tabBody"></div>
    </section>
  </main>
</div>
<div class="sheet" id="sheet" hidden></div>

<script>
"use strict";
const REPO = "Pafferitos/trading-bot", BRANCH = "dati-bot", KEY = "cdr_token", API = "https://api.github.com/repos/" + REPO;
const $ = (id) => document.getElementById(id);
const nf = (n, d = 2) => Number(n).toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d });
const usd = (n) => (n < 0 ? "−" : "") + nf(Math.abs(n)) + " $";
const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + nf(Math.abs(n)) + " $";
const cls = (n) => (n > 0 ? "gain" : n < 0 ? "loss" : "");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ls = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: (k) => { try { localStorage.removeItem(k); } catch (e) {} } };
const b64 = { dec: (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), (c) => c.charCodeAt(0))),
              enc: (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s))) };
let token = null, data = null, ctrl = null, tab = "trades", preview = false, view = "veloce";
const CTRL_KEY = { veloce: "attivo", swing: "swing_attivo", crypto: "crypto_attivo" };

const SAMPLE = (() => {
  const t = (h) => "2026-11-18 " + h;
  return { aggiornato: "2026-11-18T10:42:00-05:00", attivo: true, stato_prova: "in corso", motivo: "",
    conto: { inizio: 10000, saldo: 10142.5, equity: 10171.3, oggi: 58.8, totale: 171.3 },
    limiti: { obiettivo: 11000, pavimento_giornaliero: 9812.5, pavimento_massimo: 9142.5 },
    costanza: { profit: 142.5, best_day: 112.5, best_share_pct: 78.9 }, giorni: { "2026-11-17": 112.5, "2026-11-18": 30 },
    aperti: [{ symbol: "QQQ", side: "buy", qty: 18, entry: 512.4, stop: 512.4, target: 516.9, prezzo: 514.0, pl: 28.8, pareggio: true, why: "long 5 su 5" }],
    trades: [{ date: "2026-11-17", symbol: "SPY", side: "buy", qty: 33, entry_time: "09:55", entry: 601.2, exit_time: "11:20", exit: 604.6, net: 112.5, r: 2.25, status: "chiuso" },
             { date: "2026-11-18", symbol: "GLD", side: "sell", qty: 40, entry_time: "09:50", entry: 300.1, exit_time: "10:05", exit: 299.3, net: 30, r: 0.6, status: "chiuso" },
             { date: "2026-11-18", symbol: "QQQ", side: "buy", qty: 18, entry_time: "10:15", entry: 512.4, net: null, status: "aperto" }],
    verdetti: [{ at: t("10:15"), symbol: "QQQ", lato: "buy", proposta: "long 5 su 5: rottura, trend, VWAP, slancio, mercato", veti: [], avvisi: ["finestra d'ingresso quasi chiusa"], regole: null, esito: "inviato" },
               { at: t("10:00"), symbol: "SPY", lato: "buy", proposta: "long 5 su 5", veti: ["il prezzo è già scappato di 0,45 R dal segnale: entrerei tardi"], avvisi: [], regole: null, esito: "scartato" }],
    eventi: [{ at: t("09:25:02"), text: "Avvio: conto Alpaca demo, conto FTMO virtuale 10.142,50 $" }, { at: t("10:15:04"), text: "QQQ LONG INVIATO: 18 a mercato" }],
    notizie: [{ at: "2026-11-18T15:20:00Z", titolo: "Nvidia earnings preview: what to expect", fonte: "benzinga", forte: false }],
    regole: { ftmo: { obiettivo_pct: 10, perdita_giornaliera_pct: 3, perdita_massima_pct: 10, costanza_pct: 50 },
              bot: { rischio_pct: 0.5, stop_giornata_pct: 2, trade_al_giorno: 3, chiudi_tutto_alle: "15:55" },
              strategia: { nome: "A", finestra: [590, 630] }, simboli: ["SPY", "QQQ", "GLD"] },
    swing: { attivo: true, stato_prova: "in corso", motivo: "", fase: 1, giorni_trading: 2,
      conto: { inizio: 10000, saldo: 10000, equity: 10086.4, oggi: 21.6, totale: 86.4 },
      limiti: { obiettivo: 11000, pavimento_giornaliero: 9500, pavimento_massimo: 9000 },
      costanza: { profit: 0, best_day: 0, best_share_pct: null }, giorni: { "2026-11-17": 0, "2026-11-18": 0 },
      aperti: [{ symbol: "IVV", side: "buy", qty: 7, entry: 701.2, stop: 694.2, prezzo: 708.9, pl: 53.9 }, { symbol: "QQQM", side: "buy", qty: 7, entry: 401.2, stop: 394.2, prezzo: 405.6, pl: 30.8 }],
      trades: [{ date: "2026-11-17", symbol: "IVV", side: "buy", qty: 7, entry: 701.2, status: "aperto" }, { date: "2026-11-17", symbol: "QQQM", side: "buy", qty: 7, entry: 401.2, status: "aperto" }],
      verdetti: [{ at: "2026-11-17 15:45", symbol: "IAU", lato: "buy", proposta: "sopra la media a 200 giorni che sale", veti: ["dato macro in arrivo mentre saremmo dentro: Inflazione USA (CPI) il 10/12"], avvisi: [], regole: null, esito: "scartato" }],
      regole: { ftmo: { nome: "2-Step Swing", fasi: [10, 5], perdita_giornaliera_pct: 5, perdita_massima_pct: 10, massima: "fissa", costanza_pct: null, giorni_minimi: 4 },
                bot: { rischio_pct: 0.75, max_posizioni: 3 }, strategia: { nome: "trend 200 + meteo 10/20", media_lunga: 200, decide_alle: "15:45" }, simboli: ["IVV", "QQQM", "IAU"] } },
    crypto: { attivo: false, stato_prova: "in corso", motivo: "", fase: 1, giorni_trading: 1,
      conto: { inizio: 10000, saldo: 10000, equity: 10042.7, oggi: 18.3, totale: 42.7 },
      limiti: { obiettivo: 11000, pavimento_giornaliero: 9500, pavimento_massimo: 9000 },
      costanza: { profit: 0, best_day: 0, best_share_pct: null }, giorni: { "2026-11-18": 0 },
      aperti: [{ symbol: "BTC/USD", side: "buy", qty: 0.031245, entry: 91250, stop: 88850, prezzo: 92617, pl: 42.7 }],
      trades: [{ date: "2026-11-18", symbol: "BTC/USD", side: "buy", qty: 0.031245, entry: 91250, status: "aperto" }],
      verdetti: [{ at: "2026-11-18 15:45", symbol: "ETH/USD", lato: "buy", proposta: "sopra la media a 50 giorni", veti: [], avvisi: [], regole: null, esito: "inviato" }],
      regole: { ftmo: { nome: "2-Step Swing (crypto)", fasi: [10, 5], perdita_giornaliera_pct: 5, perdita_massima_pct: 10, massima: "fissa", costanza_pct: null, giorni_minimi: 4 },
                bot: { rischio_pct: 0.75, max_posizioni: 2 }, strategia: { nome: "crypto lento: sopra la media 50, con filtro BTC", decide_alle: "15:45" }, simboli: ["BTC/USD", "ETH/USD"] } } };
})();

async function gh(path, opts = {}) {
  const r = await fetch(API + path, Object.assign({}, opts, { cache: "no-store", headers: { Authorization: "Bearer " + token,
    Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" } }));
  if (r.status === 401) throw Object.assign(new Error("Token non valido o scaduto"), { status: 401 });
  if (r.status === 404) throw Object.assign(new Error("Il bot non ha ancora pubblicato dati"), { status: 404 });
  if (!r.ok) throw Object.assign(new Error("GitHub ha risposto " + r.status), { status: r.status });
  return r.json();
}
async function readFile(path) { const f = await gh("/contents/" + path + "?ref=" + BRANCH); return { doc: JSON.parse(b64.dec(f.content)), sha: f.sha }; }

async function refresh() {
  if (preview) { data = SAMPLE; ctrl = { doc: { attivo: true, swing_attivo: true, crypto_attivo: false } }; return render(); }
  try { ctrl = await readFile("controllo.json"); } catch (e) { if (e.status === 401) return showSetup(e.message); ctrl = { doc: { attivo: false } }; }
  try { data = (await readFile("dati/stato.json")).doc; } catch (e) { if (e.status === 401) return showSetup(e.message); data = null; $("banner").textContent = e.message; }
  render();
}

function cur() { return !data ? null : view === "veloce" ? data : data[view]; }
function render() {
  $("setup").hidden = true; $("app").hidden = false;
  document.querySelectorAll("#views button").forEach((b) => { b.setAttribute("aria-selected", b.dataset.v === view); b.onclick = () => { view = b.dataset.v; render(); }; });
  const on = ctrl && ctrl.doc[CTRL_KEY[view]];
  const fresh = data && (Date.now() - Date.parse(data.aggiornato)) / 60000 < 5;
  const dead = cur() && cur().stato_prova === "bruciata";
  $("runPill").className = "pill " + (dead ? "dead" : on && fresh ? "on" : "off");
  $("runText").textContent = dead ? "Prova bruciata" : !on ? "In pausa" : fresh ? "Attivo" : "Acceso, in attesa del mercato";
  const tb = $("toggleBtn"); tb.hidden = preview || !token; tb.textContent = on ? "Metti in pausa" : "Avvia"; tb.className = "btn " + (on ? "" : "primary");
  $("banner").textContent = preview ? "Anteprima con dati inventati." : data ? "" : "Il bot non ha ancora pubblicato dati.";
  if (!data) return;
  const d = cur();
  if (!d) { $("banner").textContent = "Questa sezione non ha ancora dati."; return; }
  const a = d.conto, lim = d.limiti, f = d.regole.ftmo;
  $("heroLabel").textContent = view === "veloce" ? "Prova FTMO 1-Step Standard" : "Prova FTMO 2-Step Swing" + (view === "crypto" ? " · crypto" : "") + " · fase " + d.fase + " di " + f.fasi.length;
  $("equity").textContent = usd(a.equity);
  $("today").textContent = signed(a.oggi); $("total").textContent = signed(a.totale);
  $("updated").textContent = new Date(data.aggiornato).toLocaleString("it-IT", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  $("challenge").textContent = { "in corso": "Prova in corso", superata: "Prova superata ✓", bruciata: "Prova bruciata", "fase superata": "Fase superata ✓" }[d.stato_prova] || d.stato_prova;
  // FTMO goals
  const tgt = lim.obiettivo - a.inizio, prog = Math.max(0, Math.min(100, 100 * a.totale / tgt));
  const dayRoom = a.equity - lim.pavimento_giornaliero, dayMax = f.perdita_giornaliera_pct / 100 * a.inizio;
  const dayUsed = Math.max(0, Math.min(100, 100 * (dayMax - dayRoom) / dayMax));
  const maxRoom = a.equity - lim.pavimento_massimo, maxMax = f.perdita_massima_pct / 100 * a.inizio;
  const maxUsed = Math.max(0, Math.min(100, 100 * (maxMax - maxRoom) / maxMax));
  const c = d.costanza, share = c.best_share_pct, objPct = f.fasi ? f.fasi[(d.fase || 1) - 1] : f.obiettivo_pct;
  const lvl = (p) => (p >= 80 ? "bad" : p >= 50 ? "warn" : "");
  $("goals").innerHTML = `
    <div class="card goal"><div class="t">Obiettivo +${objPct} %</div><div class="v num ${cls(a.totale)}">${signed(a.totale)} <span class="muted" style="font-size:14px">/ ${nf(tgt, 0)} $</span></div><div class="bar"><i style="width:${prog}%"></i></div><div class="s">${nf(prog, 0)} % della strada</div></div>
    <div class="card goal"><div class="t">Perdita di oggi (max ${f.perdita_giornaliera_pct} %)</div><div class="v num">${nf(dayRoom)} $</div><div class="bar"><i class="${lvl(dayUsed)}" style="width:${dayUsed}%"></i></div><div class="s">margine prima del limite di ${nf(dayMax, 0)} $</div></div>
    <div class="card goal"><div class="t">Perdita massima (${f.perdita_massima_pct} %)</div><div class="v num">${nf(maxRoom)} $</div><div class="bar"><i class="${lvl(maxUsed)}" style="width:${maxUsed}%"></i></div><div class="s">limite a ${nf(lim.pavimento_massimo)} $, ${f.massima === "fissa" ? "fisso" : "sale con il massimo"}</div></div>
    ${f.costanza_pct ? `<div class="card goal"><div class="t">Costanza (giorno migliore ≤ ${f.costanza_pct} %)</div><div class="v num">${share == null ? "–" : nf(share, 0) + " %"}</div><div class="bar"><i class="${share > f.costanza_pct ? "warn" : ""}" style="width:${Math.min(100, share || 0)}%"></i></div><div class="s">giorno migliore ${signed(c.best_day)}</div></div>`
      : `<div class="card goal"><div class="t">Giorni di trading (minimo ${f.giorni_minimi})</div><div class="v num">${d.giorni_trading} / ${f.giorni_minimi}</div><div class="bar"><i style="width:${Math.min(100, 100 * d.giorni_trading / (f.giorni_minimi || 1))}%"></i></div><div class="s">giorni in cui ha aperto almeno un trade</div></div>`}`;
  // open position
  $("open").innerHTML = d.aperti.length ? d.aperti.map((t) => `<div class="item"><div class="h"><span class="sym">${esc(t.symbol)}</span>
      <span class="tag ${t.side === "buy" ? "ok" : "info"}">${t.side === "buy" ? "LONG" : "SHORT"}</span>${t.pareggio ? '<span class="tag warn">stop a pareggio</span>' : ""}
      <span class="r ${cls(t.pl)}">${t.pl == null ? "–" : signed(t.pl)}</span></div>
      <div class="t">${t.qty} a ${t.entry ? nf(t.entry) : "…"} · ora ${t.prezzo ? nf(t.prezzo) : "–"} · stop ${nf(t.stop)}${t.target ? " · target " + nf(t.target) : ""}</div></div>`).join("")
    : '<div class="empty">Nessuna posizione aperta</div>';
  // the doubter
  $("verdicts").innerHTML = d.verdetti.length ? d.verdetti.slice().reverse().map((v) => `<div class="item"><div class="h">
      <span class="sym">${esc(v.symbol)}</span><span class="tag ${v.esito === "inviato" ? "ok" : "no"}">${v.esito === "inviato" ? "ORDINE INVIATO" : "FERMATO"}</span>
      <span class="r muted">${esc(v.at.slice(11, 16))}</span></div><div class="t">${esc(v.proposta)}</div>
      ${v.veti.map((x) => `<div class="t" style="color:var(--loss)">✗ ${esc(x)}</div>`).join("")}
      ${v.regole ? `<div class="t" style="color:var(--loss)">✗ regole: ${esc(v.regole)}</div>` : ""}
      ${v.avvisi.map((x) => `<div class="t" style="color:var(--warn)">! ${esc(x)}</div>`).join("")}</div>`).join("")
    : '<div class="empty">Ancora nessuna proposta oggi</div>';
  renderTab();
}

function renderTab() {
  document.querySelectorAll("#tabs .tab").forEach((b) => { b.setAttribute("aria-selected", b.dataset.t === tab); b.onclick = () => { tab = b.dataset.t; renderTab(); }; });
  const d = cur(), el = $("tabBody");
  if (!d) { el.innerHTML = ""; return; }
  if (tab === "trades") {
    el.innerHTML = d.trades.length ? `<div class="tw"><table><thead><tr><th>Data</th><th>Titolo</th><th>Lato</th><th class="r">Qtà</th><th>Entrata</th><th>Uscita</th><th class="r">R</th><th class="r">Netto</th></tr></thead><tbody>
      ${d.trades.slice().reverse().filter((t) => t.status !== "annullato").map((t) => `<tr><td class="num">${t.date.slice(8)}/${t.date.slice(5, 7)}</td><td class="num"><b>${esc(t.symbol)}</b></td>
      <td>${t.side === "buy" ? "long" : "short"}</td><td class="r num">${t.qty}</td><td class="num">${esc(t.entry_time || "")}${t.entry_time ? " · " : ""}${t.entry ? nf(t.entry) : "…"}</td>
      <td class="num">${t.status === "chiuso" ? esc(t.exit_time || (t.exit_date || "").slice(5)) + " · " + nf(t.exit) : '<span class="muted">aperto</span>'}</td>
      <td class="r num ${cls(t.r)}">${t.r == null ? "–" : nf(t.r)}</td><td class="r num ${cls(t.net)}">${t.status === "chiuso" ? signed(t.net) : "–"}</td></tr>`).join("")}</tbody></table></div>`
      : '<div class="empty">Ancora nessuna operazione</div>';
  } else if (tab === "days") {
    const days = Object.entries(d.giorni).sort().reverse();
    el.innerHTML = days.length ? `<div class="tw"><table><thead><tr><th>Giorno</th><th class="r">Netto</th></tr></thead><tbody>${days.map(([k, v]) =>
      `<tr><td class="num">${k.split("-").reverse().join("/")}</td><td class="r num ${cls(v)}">${signed(v)}</td></tr>`).join("")}</tbody></table></div>` : '<div class="empty">Nessun giorno ancora</div>';
  } else if (tab === "log") {
    el.innerHTML = data.eventi.length ? `<div class="log scroll">${data.eventi.slice().reverse().map((e) => `<div><time>${esc(e.at.slice(11, 16))}</time><span>${esc(e.text)}</span></div>`).join("")}</div>` : '<div class="empty">Registro vuoto</div>';
  } else if (tab === "news") {
    el.innerHTML = data.notizie.length ? `<div class="list scroll">${data.notizie.map((n) => `<div class="item"><div class="h">${n.forte ? '<span class="tag no">forte</span>' : ""}<span class="r muted">${esc((n.at || "").slice(11, 16))} UTC</span></div><div>${esc(n.titolo)}</div><div class="t">${esc(n.fonte)}</div></div>`).join("")}</div>` : '<div class="empty">Nessuna notizia</div>';
  } else {
    const r = d.regole, kv = (k, v) => (v === undefined || v === null ? "" : `<tr><td class="muted">${k}</td><td class="r num">${v}</td></tr>`);
    const fasi = r.ftmo.fasi || [r.ftmo.obiettivo_pct];
    el.innerHTML = `<div class="tw"><table class="rules-t"><tbody>
      ${kv("Prova", esc(r.ftmo.nome || ""))}${kv("Conto della prova", usd(d.conto.inizio))}${kv("Obiettivo", fasi.map((x) => "+" + x + " %").join(" poi "))}
      ${kv("Perdita massima al giorno (FTMO)", r.ftmo.perdita_giornaliera_pct + " %")}
      ${kv("Perdita massima totale (FTMO)", r.ftmo.perdita_massima_pct + " % " + (r.ftmo.massima === "fissa" ? "fissa" : "che sale con il massimo di fine giornata"))}
      ${r.ftmo.costanza_pct ? kv("Giorno migliore al massimo", r.ftmo.costanza_pct + " % del profitto") : ""}${r.ftmo.giorni_minimi ? kv("Giorni minimi di trading", r.ftmo.giorni_minimi) : ""}
      ${kv("Rischio a trade (bot)", r.bot.rischio_pct + " %")}${r.bot.stop_giornata_pct ? kv("Stop di giornata (bot)", r.bot.stop_giornata_pct + " %") : ""}
      ${r.bot.trade_al_giorno ? kv("Trade al giorno", r.bot.trade_al_giorno) : ""}${r.bot.max_posizioni ? kv("Posizioni al massimo", r.bot.max_posizioni) : ""}
      ${r.bot.chiudi_tutto_alle ? kv("Tutto chiuso alle (New York)", r.bot.chiudi_tutto_alle) : kv("Decide ogni giorno alle (New York)", r.strategia.decide_alle)}
      ${kv("Strategia", esc(r.strategia.nome))}${kv("Titoli", esc(r.simboli.join(", ")))}</tbody></table></div>`;
  }
}

async function toggle() {
  const key = CTRL_KEY[view], next = !ctrl.doc[key], name = { veloce: "la sezione Veloce", swing: "la sezione Swing", crypto: "la sezione Crypto" }[view];
  $("sheet").hidden = false;
  $("sheet").innerHTML = `<div class="card"><h3>${next ? "Avviare " + name + "?" : "Mettere in pausa " + name + "?"}</h3>
    <div class="muted">${next ? "Da quando il bot lo legge (entro 3 minuti) può aprire nuovi trade sul conto demo." : "Niente nuovi trade. Le posizioni aperte restano gestite con stop, target e chiusura alle 15:55."}</div>
    <div style="display:flex;gap:8px"><button class="btn primary" id="yes">${next ? "Avvia" : "Metti in pausa"}</button><button class="btn" id="no">Annulla</button></div></div>`;
  $("no").onclick = () => ($("sheet").hidden = true);
  $("yes").onclick = async () => {
    $("yes").disabled = true;
    try {
      const doc = Object.assign({}, ctrl.doc, { [key]: next, cambiato: new Date().toISOString(), da: "cabina-di-regia" });
      await gh("/contents/controllo.json", { method: "PUT", body: JSON.stringify({ message: "Cabina: " + (next ? "avvio " : "pausa ") + view, branch: BRANCH,
        content: b64.enc(JSON.stringify(doc, null, 2) + "\n"), sha: ctrl.sha }) });
      $("sheet").hidden = true; refresh();
    } catch (e) { $("sheet").querySelector(".muted").textContent = e.message; }
  };
}

function showSetup(msg) {
  $("app").hidden = true; $("setup").hidden = false; $("toggleBtn").hidden = true;
  $("runText").textContent = "Scollegato"; $("runPill").className = "pill";
  const e = $("tokErr"); e.hidden = !msg; e.textContent = msg || "";
}
$("tokGo").onclick = async () => {
  const t = $("tok").value.trim();
  if (!/^(github_pat_|ghp_)/.test(t)) { $("tokErr").hidden = false; $("tokErr").textContent = "Il token inizia con github_pat_"; return; }
  token = t; ls.set(KEY, t); preview = false; refresh();
};
$("tokPreview").onclick = () => { preview = true; refresh(); };
$("toggleBtn").onclick = toggle;
token = ls.get(KEY);
if (token) refresh(); else showSetup();
setInterval(() => { if (!document.hidden && (token || preview)) refresh(); }, 60000);
</script>
</body>
</html>
